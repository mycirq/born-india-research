<!-- @dsCard group="Colors" viewport="700x170" name="Paper & Ink" subtitle="Warm paper ground, warm-black ink — never pure #fff or #000" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:var(--surface-card);color:var(--text-body);font-family:var(--font-sans);padding:20px 24px}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}
  .row{display:flex;gap:12px}
  .col{display:flex;flex-direction:column}
  
  .sw{display:flex;flex-direction:column;gap:6px;flex:1}
  .chip{height:56px;border-radius:var(--radius-2);border:1px solid rgba(21,19,14,.08)}
  .nm{font:var(--type-caption);color:var(--text-heading)}
  .hex{font:var(--type-label);letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase}
  .grid{display:flex;gap:10px}

</style></head>
<body>
<div class="grid">
<div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="nm">Paper</div><div class="hex">#F7F4EC · --paper</div></div><div class="sw"><div class="chip" style="background:var(--paper-sunk)"></div><div class="nm">Paper sunk</div><div class="hex">#F0ECE0 · --paper-sunk</div></div><div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="nm">Surface</div><div class="hex">#FFFDF8 · --surface</div></div><div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="nm">Ink 900</div><div class="hex">#15130E · --ink-900</div></div><div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="nm">Ink 700</div><div class="hex">#3A362C · --ink-700</div></div>
</div>
</body></html>
