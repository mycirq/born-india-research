<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base, ten steps" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:var(--surface-card);color:var(--text-body);font-family:var(--font-sans);padding:20px 24px}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}
  .row{display:flex;gap:12px}
  .col{display:flex;flex-direction:column}
  
</style></head>
<body>
<div style="display:flex;align-items:flex-end;gap:14px">
<div style="text-align:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--laterite-500);border-radius:1px"></div><div class="lbl" style="margin-top:8px">1</div></div><div style="text-align:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--laterite-500);border-radius:1px"></div><div class="lbl" style="margin-top:8px">2</div></div><div style="text-align:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--laterite-500);border-radius:1px"></div><div class="lbl" style="margin-top:8px">3</div></div><div style="text-align:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--laterite-500);border-radius:1px"></div><div class="lbl" style="margin-top:8px">4</div></div><div style="text-align:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--laterite-500);border-radius:1px"></div><div class="lbl" style="margin-top:8px">5</div></div><div style="text-align:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--laterite-500);border-radius:1px"></div><div class="lbl" style="margin-top:8px">6</div></div><div style="text-align:center"><div style="width:var(--space-7);height:var(--space-7);background:var(--laterite-500);border-radius:1px"></div><div class="lbl" style="margin-top:8px">7</div></div><div style="text-align:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--laterite-500);border-radius:1px"></div><div class="lbl" style="margin-top:8px">8</div></div>
</div>
<p style="margin-top:16px;font:var(--type-caption);color:var(--text-muted)">4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 · 128 — sections use --space-9, cards --space-6.</p>
</body></html>
