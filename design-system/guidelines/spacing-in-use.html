<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:var(--surface-card);color:var(--text-body);font-family:var(--font-sans);padding:20px 24px}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}
  .row{display:flex;gap:12px}
  .col{display:flex;flex-direction:column}
  body{background:var(--paper)}
</style></head>
<body>
<div style="background:var(--surface-card);border:1px solid var(--line);border-radius:var(--radius-2);padding:var(--card-padding);max-width:340px">
  <div class="lbl" style="color:var(--laterite-500)">01</div>
  <div style="font:var(--type-subtitle);color:var(--text-heading);margin-top:var(--space-3)">We do the groundwork</div>
  <div style="font:var(--type-small);color:var(--text-muted);margin-top:var(--space-2)">Cities, micro-markets, the numbers, and the people.</div>
</div>
</body></html>
