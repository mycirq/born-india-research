<!-- @dsCard group="Brand" viewport="700x210" name="Voice" subtitle="Plain, second-person, no hype, no emoji" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:var(--surface-card);color:var(--text-body);font-family:var(--font-sans);padding:20px 24px}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}
  .row{display:flex;gap:12px}
  .col{display:flex;flex-direction:column}
  
</style></head>
<body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
  <div><div class="lbl" style="color:var(--verified-500)">We say</div>
  <ul style="margin:10px 0 0;padding-left:18px;font:var(--type-small);color:var(--text-body);display:flex;flex-direction:column;gap:8px">
    <li>"We do the groundwork."</li><li>"The decision always stays yours."</li><li>"We're early. Building slowly, honestly."</li></ul></div>
  <div><div class="lbl" style="color:var(--flag-500)">We don't say</div>
  <ul style="margin:10px 0 0;padding-left:18px;font:var(--type-small);color:var(--text-muted);display:flex;flex-direction:column;gap:8px">
    <li>"Unlock exponential returns 🚀"</li><li>"India's #1 property platform"</li><li>"Limited slots — act now"</li></ul></div>
</div>
</body></html>
