<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:var(--surface-card);color:var(--text-body);font-family:var(--font-sans);padding:20px 24px}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}
  .row{display:flex;gap:12px}
  .col{display:flex;flex-direction:column}
  
</style></head>
<body>
<div style="display:flex;flex-direction:column;gap:16px;max-width:420px">
  <div style="display:flex;align-items:baseline;gap:12px"><span style="font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--laterite-500)">02</span><span style="flex:1;border-top:1px solid var(--line-strong)"></span></div>
  <div style="display:flex;align-items:baseline;font:var(--type-data);color:var(--text-body)"><span>Ticket size</span><span style="flex:1;border-bottom:1px dotted var(--ink-100);margin:0 8px;transform:translateY(-3px)"></span><span>₹1.8–2.4 Cr</span></div>
  <div style="display:flex;align-items:baseline;font:var(--type-data);color:var(--text-body)"><span>Site visits</span><span style="flex:1;border-bottom:1px dotted var(--ink-100);margin:0 8px;transform:translateY(-3px)"></span><span>11</span></div>
  <div style="font:var(--type-caption);color:var(--text-muted);border-left:2px solid var(--laterite-500);padding-left:12px">Field note — the annotation voice, always in caption size.</div>
</div>
</body></html>
