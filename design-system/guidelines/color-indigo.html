<!-- @dsCard group="Colors" viewport="700x180" name="Indigo support" subtitle="Dye indigo — links, data emphasis, chart series" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:var(--surface-card);color:var(--text-body);font-family:var(--font-sans);padding:20px 24px}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}
  .row{display:flex;gap:12px}
  .col{display:flex;flex-direction:column}
  
  .sw{display:flex;flex-direction:column;gap:6px;flex:1}
  .chip{height:56px;border-radius:var(--radius-2);border:1px solid rgba(21,19,14,.08)}
  .nm{font:var(--type-caption);color:var(--text-heading)}
  .hex{font:var(--type-label);letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase}
  .grid{display:flex;gap:10px}

</style></head>
<body>
<div class="grid">
<div class="sw"><div class="chip" style="background:var(--indigo-600)"></div><div class="nm">Indigo 600</div><div class="hex">#222C4B · --indigo-600</div></div><div class="sw"><div class="chip" style="background:var(--indigo-500)"></div><div class="nm">Indigo 500</div><div class="hex">#2C3A63 · --indigo-500</div></div><div class="sw"><div class="chip" style="background:var(--indigo-200)"></div><div class="nm">Indigo 200</div><div class="hex">#C3C8D8 · --indigo-200</div></div><div class="sw"><div class="chip" style="background:var(--indigo-100)"></div><div class="nm">Indigo 100</div><div class="hex">#E3E5EE · --indigo-100</div></div>
</div>
<p style="margin-top:14px;font:var(--type-caption);color:var(--text-muted)">Indigo never competes with laterite. Accent = laterite; indigo = quiet structure and links.</p>
</body></html>
