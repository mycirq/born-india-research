<!-- @dsCard group="Colors" viewport="700x180" name="Laterite accent" subtitle="The single brand accent — soil red-ochre. Used sparingly: one per view" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:var(--surface-card);color:var(--text-body);font-family:var(--font-sans);padding:20px 24px}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}
  .row{display:flex;gap:12px}
  .col{display:flex;flex-direction:column}
  
  .sw{display:flex;flex-direction:column;gap:6px;flex:1}
  .chip{height:56px;border-radius:var(--radius-2);border:1px solid rgba(21,19,14,.08)}
  .nm{font:var(--type-caption);color:var(--text-heading)}
  .hex{font:var(--type-label);letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase}
  .grid{display:flex;gap:10px}

</style></head>
<body>
<div class="grid">
<div class="sw"><div class="chip" style="background:var(--laterite-700)"></div><div class="nm">Laterite 700</div><div class="hex">#7F3413 · --laterite-700</div></div><div class="sw"><div class="chip" style="background:var(--laterite-600)"></div><div class="nm">Laterite 600</div><div class="hex">#8C3915 · --laterite-600</div></div><div class="sw"><div class="chip" style="background:var(--laterite-500)"></div><div class="nm">Laterite 500</div><div class="hex">#A8461D · --laterite-500</div></div><div class="sw"><div class="chip" style="background:var(--laterite-200)"></div><div class="nm">Laterite 200</div><div class="hex">#E6CBBC · --laterite-200</div></div><div class="sw"><div class="chip" style="background:var(--laterite-100)"></div><div class="nm">Laterite 100</div><div class="hex">#F3E4DB · --laterite-100</div></div>
</div>
<p style="margin-top:14px;font:var(--type-caption);color:var(--text-muted)">500 for marks, rules and hover fills · 600/700 for text on paper · 100 for washes behind labels.</p>
</body></html>
