<!-- @dsCard group="Colors" viewport="700x170" name="Neutrals & rules" subtitle="Secondary text steps and the two hairline weights" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:var(--surface-card);color:var(--text-body);font-family:var(--font-sans);padding:20px 24px}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}
  .row{display:flex;gap:12px}
  .col{display:flex;flex-direction:column}
  
  .sw{display:flex;flex-direction:column;gap:6px;flex:1}
  .chip{height:56px;border-radius:var(--radius-2);border:1px solid rgba(21,19,14,.08)}
  .nm{font:var(--type-caption);color:var(--text-heading)}
  .hex{font:var(--type-label);letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase}
  .grid{display:flex;gap:10px}

</style></head>
<body>
<div class="grid">
<div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="nm">Ink 500</div><div class="hex">#6B6455 · --ink-500</div></div><div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="nm">Ink 300</div><div class="hex">#9C9484 · --ink-300</div></div><div class="sw"><div class="chip" style="background:var(--ink-100)"></div><div class="nm">Ink 100</div><div class="hex">#CFC8B8 · --ink-100</div></div><div class="sw"><div class="chip" style="background:var(--line)"></div><div class="nm">Line</div><div class="hex">#E6E0D2 · --line</div></div><div class="sw"><div class="chip" style="background:var(--line-strong)"></div><div class="nm">Line strong</div><div class="hex">#D6CFBE · --line-strong</div></div>
</div>
</body></html>
