<!doctype html>
<html><head><meta charset="utf-8"><title>Reel frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f4ec; --ink-900:#15130e; --ink-700:#3a362c; --ink-500:#6b6455;
    --ink-300:#736b5c; --line:#e6e0d2; --line-strong:#d6cfbe;
    --lat:#a8461d; --lat-600:#8c3915; --lat-100:#f3e4db;
    --display:"Newsreader",Georgia,serif; --sans:"Public Sans",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0}
  body{background:#5a5a5a;padding:0}
  /* 405x720 CSS captures at 2x to 810x1440, then ffmpeg scales to 1080x1920.
     Two per row so a row fits the viewport. */
  #sheet{display:grid;grid-template-columns:repeat(2,405px);gap:0;width:810px}
  .f{width:405px;height:720px;background:var(--paper);color:var(--ink-700);
     padding:46px 40px 38px;display:flex;flex-direction:column;font-family:var(--sans);
     font-optical-sizing:auto;overflow:hidden;position:relative}
  .eb{font:500 8.5px/1.2 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--lat-600)}
  .title{font:400 40px/1.1 var(--display);letter-spacing:-.024em;color:var(--ink-900);margin-top:28px}
  .sub{font:400 13px/1.55 var(--sans);color:var(--ink-500);margin-top:18px;max-width:32ch}
  .city{font:500 30px/1.1 var(--display);letter-spacing:-.018em;color:var(--ink-900);margin-top:26px}
  .sq{font:400 62px/1 var(--mono);letter-spacing:-.02em;color:var(--ink-900);margin-top:6px}
  .squ{font:500 9px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-500);margin-top:10px}
  /* the area block: width and height scale with real floor area */
  .areawrap{margin-top:auto;display:flex;align-items:flex-end;justify-content:flex-start;
    height:290px;position:relative}
  .area{background:var(--lat-100);border:1.5px solid var(--lat);position:relative}
  .area .tick{position:absolute;bottom:6px;left:8px;font:500 8px/1 var(--mono);
    letter-spacing:.14em;text-transform:uppercase;color:var(--lat-600)}
  .ghost{position:absolute;left:0;bottom:0;border:1px dashed var(--line-strong);
    background:transparent;pointer-events:none}
  .foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:8px}
  .foot .src{font:400 7.5px/1.35 var(--mono);letter-spacing:.04em;color:var(--ink-300);text-transform:uppercase;white-space:nowrap}
  .wm{display:flex;align-items:center;gap:7px;margin-left:auto}
  .wm span{font:500 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-900)}
</style></head><body>
<div id="sheet"></div>
<script>
const MARK = `<span class="wm"><svg width="15" height="15" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="31" fill="#a8461d"/>
  <g stroke="#f7f4ec" fill="none" stroke-width="1.4" opacity=".62">
    <ellipse cx="32" cy="32" rx="12.5" ry="31"/><line x1="1" y1="32" x2="63" y2="32"/></g>
  <circle cx="41.5" cy="24" r="4.6" fill="#f7f4ec"/></svg><span>Groundwork</span></span>`;

const SRC = "NHB RESIDEX · as of 2026-03-31";
// sqft at each city's weighted median rate for ₹1 crore. Derived, and labelled as such.
const CITIES = [
  { city:"Dehradun",  sqft:1225, rate:"₹8,161"  },
  { city:"Bengaluru", sqft:813,  rate:"₹12,301" },
  { city:"Gurgaon",   sqft:527,  rate:"₹18,967" },
  { city:"Mumbai",    sqft:340,  rate:"₹29,407" },
];
const MAX = 1225, BOXW = 300, BOXH = 280;   // Dehradun fills the box; others scale by area

function areaBlock(sqft){
  // scale linearly on each side by sqrt(area ratio) so the *area* is proportional
  const k = Math.sqrt(sqft / MAX);
  const w = Math.round(BOXW * k), h = Math.round(BOXH * k);
  return `<div class="areawrap">
    <div class="ghost" style="width:${BOXW}px;height:${BOXH}px"></div>
    <div class="area" style="width:${w}px;height:${h}px">
      <span class="tick">${sqft.toLocaleString()} sqft</span></div></div>`;
}
const foot = `<div class="foot"><span class="src">${SRC}</span>${MARK}</div>`;

const frames = [];
frames.push(`<div class="f" data-n="01">
  <div class="eb">One crore</div>
  <div class="title">What ₹1 crore buys you, in four Indian cities.</div>
  <div class="sub">Carpet area at each city's weighted median rate. Same money, same source, same date.</div>
  <div class="areawrap"><div class="ghost" style="width:${BOXW}px;height:${BOXH}px"></div></div>
  ${foot}</div>`);

CITIES.forEach((c, i) => frames.push(`<div class="f" data-n="0${i+2}">
  <div class="eb">One crore · ${i+1} of 4</div>
  <div class="city">${c.city}</div>
  <div class="sq">${c.sqft.toLocaleString()}</div>
  <div class="squ">square feet · at ${c.rate} per sqft</div>
  ${areaBlock(c.sqft)}
  ${foot}</div>`));

frames.push(`<div class="f" data-n="06">
  <div class="eb">Read it carefully</div>
  <div class="title">This is arithmetic, not advice.</div>
  <div class="sub">A median rate is not the rate of any particular flat, and floor space is
    only one of the things a home is. Derived figure, marked as derived.</div>
  <div class="areawrap"><div class="ghost" style="width:${BOXW}px;height:${BOXH}px"></div></div>
  ${foot}</div>`);

document.getElementById("sheet").innerHTML = frames.join("");
document.fonts.ready.then(()=>{ window.__ready = true; });
</script>
</body></html>
